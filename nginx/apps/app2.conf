# app2 (random-table2image): frontend on app2-frontend:5102, backend on app2-backend:8102.
location = /app2 {
    return 301 /app2/;
}

# API: strip the /app2 prefix, so the backend sees /api/...
location /app2/api/ {
    set $upstream http://app2-backend:8102;
    rewrite ^/app2(/.*)$ $1 break;
    proxy_pass $upstream;
    # Stream responses (e.g. large dataset zips) instead of buffering them in nginx.
    proxy_buffering off;
}

# Everything else (pages, assets, HMR websocket): Vite serves under its base path /app2/, so pass it as is.
location /app2/ {
    set $upstream http://app2-frontend:5102;
    proxy_pass $upstream;
}
