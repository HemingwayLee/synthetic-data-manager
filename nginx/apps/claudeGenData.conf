# claudeGenData: frontend on claudegendata-frontend:5101, backend on claudegendata-backend:8101.
location = /claudeGenData {
    return 301 /claudeGenData/;
}

# API: strip the /claudeGenData prefix, so the backend sees /api/...
location /claudeGenData/api/ {
    set $upstream http://claudegendata-backend:8101;
    rewrite ^/claudeGenData(/.*)$ $1 break;
    proxy_pass $upstream;
    # Let streamed responses (SSE) through as they are produced.
    proxy_buffering off;
    # A Claude Code turn can go quiet for a long time while a tool runs; don't cut the stream.
    proxy_read_timeout 3600s;
}

# Everything else (pages, assets, HMR websocket): Vite serves under its base path /claudeGenData/, so pass it as is.
location /claudeGenData/ {
    set $upstream http://claudegendata-frontend:5101;
    proxy_pass $upstream;
}
