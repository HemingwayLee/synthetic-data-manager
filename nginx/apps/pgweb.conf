# pgweb (optional, docker-compose.pgweb.yml): https://<host>/pgweb/ -> pgweb-proxy:8082, with /pgweb stripped.
# pgweb-proxy refuses these requests unless PGWEB_VIA_HTTPS=true. pgweb uses relative URLs, so it needs no prefix setting.
location = /pgweb {
    return 301 /pgweb/;
}

location /pgweb/ {
    set $upstream http://pgweb-proxy:8082;
    rewrite ^/pgweb(/.*)$ $1 break;
    proxy_pass $upstream;
    # pgweb's compose project isn't running (its hostname doesn't resolve).
    error_page 502 = @pgweb_down;
}

location @pgweb_down {
    default_type text/plain;
    return 503 "pgweb is not running: docker compose -f docker-compose.pgweb.yml up -d\n";
}
