# randomHtmlTables: frontend on randomhtmltables-frontend:5102, backend on randomhtmltables-backend:8102.
location = /randomHtmlTables {
    return 301 /randomHtmlTables/;
}

# API: strip the /randomHtmlTables prefix, so the backend sees /api/...
location /randomHtmlTables/api/ {
    set $upstream http://randomhtmltables-backend:8102;
    rewrite ^/randomHtmlTables(/.*)$ $1 break;
    proxy_pass $upstream;
    # Stream responses (e.g. large dataset zips) instead of buffering them in nginx.
    proxy_buffering off;
}

# Everything else (pages, assets, HMR websocket): Vite serves under its base path /randomHtmlTables/, so pass it as is.
location /randomHtmlTables/ {
    set $upstream http://randomhtmltables-frontend:5102;
    proxy_pass $upstream;
}
