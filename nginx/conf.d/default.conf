# Upgrade WebSocket connections (Vite HMR) and keep normal requests as plain HTTP/1.1.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 50m;

    # Docker's DNS. Upstreams are looked up per request (see `set $upstream` in apps/*.conf), so nginx starts
    # even while an app container is down and follows it when it restarts with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 300s;

    # Landing page listing the apps.
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # One file per webapp.
    include /etc/nginx/apps/*.conf;
}
