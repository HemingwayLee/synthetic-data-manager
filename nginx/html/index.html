<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webapps</title>
    <style>
      :root {
        --bg: #fff; --fg: #111; --muted: #666; --border: #ddd; --border-hover: #999; --panel: #f7f7f7;
        --ok: #1a7f37; --fail: #cf222e; --warn: #9a6700; --pending: #888;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1a1a; --fg: #eee; --muted: #999; --border: #444; --border-hover: #777; --panel: #222;
          --ok: #3fb950; --fail: #f85149; --warn: #d29922; --pending: #888;
        }
      }
      * { box-sizing: border-box; }
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 48px auto; padding: 0 16px; background: var(--bg); color: var(--fg); }
      h1 { margin-bottom: 4px; }
      h2 { font-size: 1.1rem; margin: 32px 0 8px; }
      .sub { color: var(--muted); margin: 0 0 16px; }
      .card { border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin: 8px 0; }
      .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .card-head a { color: inherit; text-decoration: none; font-weight: 600; }
      .card-head a:hover { text-decoration: underline; }
      .card-head small { color: var(--muted); font-weight: normal; }
      .checks { margin-top: 8px; display: grid; gap: 4px; }
      .row { display: grid; grid-template-columns: 76px 1fr auto; gap: 8px; align-items: baseline; font-size: 0.9rem; }
      .row .label { color: var(--muted); }
      .row .target { font-family: ui-monospace, monospace; font-size: 0.8rem; color: var(--muted); overflow-wrap: anywhere; }
      .row .detail { grid-column: 2 / 4; font-size: 0.8rem; color: var(--muted); overflow-wrap: anywhere; }
      .status { font-weight: 600; white-space: nowrap; }
      .status.ok { color: var(--ok); } .status.fail { color: var(--fail); }
      .status.warn { color: var(--warn); } .status.pending { color: var(--pending); }
      button { font: inherit; padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--fg); cursor: pointer; }
      button:hover { border-color: var(--border-hover); }
      .actions { display: flex; gap: 6px; flex-shrink: 0; }
      .card-head .go { font: inherit; padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--fg); color: var(--bg); text-decoration: none; font-weight: 600; }
      .card-head .go:hover { opacity: 0.85; text-decoration: none; }
      button:disabled { opacity: 0.6; cursor: default; }
      form { display: flex; gap: 8px; flex-wrap: wrap; }
      input, select { font: inherit; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); }
      input[type="text"] { flex: 1 1 240px; min-width: 0; }
      pre { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; font-size: 0.8rem; max-height: 320px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0 0; }
      .toolbar { display: flex; justify-content: flex-end; }
    </style>
  </head>
  <body>
    <h1>Webapps</h1>
    <p class="sub">Each app's frontend and backend (and pgweb, if enabled) are checked through nginx when this page loads.</p>

    <div class="toolbar"><button id="test-all" type="button">Re-test all</button></div>
    <div id="apps"></div>

    <h2>Test a URL</h2>
    <p class="sub">Relative paths (e.g. <code>/claudeGenData/api/health</code>) go through this nginx. Other origins may be blocked by CORS.</p>
    <form id="custom-form">
      <select id="custom-method" aria-label="HTTP method">
        <option>GET</option><option>HEAD</option><option>POST</option>
      </select>
      <input id="custom-url" type="text" placeholder="/claudeGenData/api/health or https://example.com" aria-label="URL" required />
      <button type="submit">Test</button>
    </form>
    <div id="custom-result"></div>

    <script>
      // Add an entry here when adding a webapp (alongside nginx/apps/<name>.conf). `kind` picks the checks below.
      const APPS = [
        { name: "claudeGenData", path: "/claudeGenData/", kind: "webapp" },
        { name: "randomHtmlTables", path: "/randomHtmlTables/", kind: "webapp" },
        { name: "pgweb", path: "/pgweb/", kind: "pgweb" },
      ];

      const TIMEOUT_MS = 8000;

      async function probe(url, { method = "GET" } = {}) {
        const started = performance.now();
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
        try {
          const res = await fetch(url, { method, cache: "no-store", signal: ctrl.signal });
          const ms = Math.round(performance.now() - started);
          const body = method === "HEAD" ? "" : await res.text();
          return { reached: true, res, body, ms };
        } catch (err) {
          const ms = Math.round(performance.now() - started);
          if (err.name === "AbortError") return { reached: false, error: `Timed out after ${TIMEOUT_MS / 1000}s`, ms };
          // A TypeError on a cross-origin URL is usually CORS: retry opaquely to tell "unreachable" from "blocked".
          try {
            await fetch(url, { method: "GET", mode: "no-cors", cache: "no-store" });
            return { reached: true, opaque: true, ms: Math.round(performance.now() - started) };
          } catch {
            return { reached: false, error: err.message || String(err), ms };
          }
        } finally {
          clearTimeout(timer);
        }
      }

      function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }

      function setRow(row, state, statusText, detail) {
        row.status.className = `status ${state}`;
        row.status.textContent = statusText;
        row.detail.textContent = detail || "";
      }

      function makeRow(label, target) {
        const wrap = el("div", "row");
        const status = el("span", "status pending", "…");
        const detail = el("span", "detail");
        wrap.append(el("span", "label", label), el("span", "target", target), status, detail);
        return { wrap, status, detail };
      }

      async function testFrontend(app, row) {
        setRow(row, "pending", "testing…");
        const r = await probe(app.path);
        if (!r.reached) return setRow(row, "fail", "unreachable", r.error);
        const { res, body, ms } = r;
        if (!res.ok) {
          const hint = res.status === 502 || res.status === 504 ? " — is the frontend container running?" : "";
          return setRow(row, "fail", `${res.status}`, `${res.statusText}${hint} (${ms} ms)`);
        }
        const isHtml = (res.headers.get("content-type") || "").includes("text/html") && /<html/i.test(body);
        setRow(row, isHtml ? "ok" : "warn", isHtml ? `OK ${res.status}` : `${res.status}`,
          isHtml ? `HTML served (${ms} ms)` : `Unexpected content-type: ${res.headers.get("content-type")} (${ms} ms)`);
      }

      async function testBackend(app, row) {
        setRow(row, "pending", "testing…");
        const r = await probe(`${app.path}api/health`);
        if (!r.reached) return setRow(row, "fail", "unreachable", r.error);
        const { res, body, ms } = r;
        let json = null;
        try { json = JSON.parse(body); } catch {}
        if (!res.ok) {
          const hint = res.status === 502 || res.status === 504 ? " — is the backend container running?" : "";
          const detail = json?.detail ? ` — ${typeof json.detail === "string" ? json.detail : JSON.stringify(json.detail)}` : "";
          return setRow(row, "fail", `${res.status}`, `${res.statusText}${hint}${detail} (${ms} ms)`);
        }
        if (json?.status === "ok") {
          return setRow(row, "ok", `OK ${res.status}`, `app=${json.app}, database=${json.database} (${ms} ms)`);
        }
        setRow(row, "warn", `${res.status}`, `Unexpected response: ${body.slice(0, 200)} (${ms} ms)`);
      }

      // pgweb is optional: 404 = PGWEB_VIA_HTTPS is off, 503 = its compose project isn't running (nginx/apps/pgweb.conf).
      async function testPgweb(app, row) {
        setRow(row, "pending", "testing…");
        const r = await probe(`${app.path}api/databases`);
        if (!r.reached) return setRow(row, "fail", "unreachable", r.error);
        const { res, body, ms } = r;
        if (res.status === 401) return setRow(row, "ok", "login", `Reachable; asks for PGWEB_AUTH_USER / PGWEB_AUTH_PASS (${ms} ms)`);
        if (res.status === 404) return setRow(row, "warn", "off", `Set PGWEB_VIA_HTTPS=true and restart pgweb, or use http://${location.hostname}:8081 on the host (${ms} ms)`);
        if (res.status === 503) return setRow(row, "warn", "stopped", `docker compose -f docker-compose.pgweb.yml up -d (${ms} ms)`);
        let dbs = null;
        try { dbs = JSON.parse(body); } catch {}
        if (res.ok && Array.isArray(dbs)) return setRow(row, "ok", `OK ${res.status}`, `databases: ${dbs.join(", ")} (${ms} ms)`);
        setRow(row, "fail", `${res.status}`, `${res.statusText} ${body.slice(0, 200)} (${ms} ms)`.trim());
      }

      const CHECKS = {
        webapp: (app) => [
          ["Frontend", app.path, testFrontend],
          ["Backend", `${app.path}api/health`, testBackend],
        ],
        pgweb: (app) => [["Database", `${app.path}api/databases`, testPgweb]],
      };

      const appsEl = document.getElementById("apps");
      const rows = APPS.map((app) => {
        const card = el("div", "card");
        const head = el("div", "card-head");
        const link = el("a");
        link.href = app.path;
        link.append(`${app.name} `, el("small", null, `— ${app.path}`));
        const go = el("a", "go", "Go");
        go.href = app.path;
        go.title = `Open ${app.name}`;
        const btn = el("button", null, "Test");
        btn.type = "button";
        const actions = el("div", "actions");
        actions.append(btn, go);
        head.append(link, actions);
        const checks = el("div", "checks");
        const tests = CHECKS[app.kind](app).map(([label, target, test]) => {
          const row = makeRow(label, target);
          checks.append(row.wrap);
          return () => test(app, row);
        });
        card.append(head, checks);
        appsEl.append(card);
        const run = async () => {
          btn.disabled = true;
          await Promise.all(tests.map((t) => t()));
          btn.disabled = false;
        };
        btn.addEventListener("click", run);
        return run;
      });

      const testAllBtn = document.getElementById("test-all");
      async function testAll() {
        testAllBtn.disabled = true;
        await Promise.all(rows.map((run) => run()));
        testAllBtn.disabled = false;
      }
      testAllBtn.addEventListener("click", testAll);
      testAll();

      // Free-form URL test.
      const form = document.getElementById("custom-form");
      const resultEl = document.getElementById("custom-result");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const raw = document.getElementById("custom-url").value.trim();
        const method = document.getElementById("custom-method").value;
        if (!raw) return;
        let url;
        try {
          // Bare hostnames like "example.com" get https://; paths stay relative to this origin.
          const withScheme = /^[a-z][a-z0-9+.-]*:\/\//i.test(raw) || raw.startsWith("/") ? raw : `https://${raw}`;
          url = new URL(withScheme, location.origin).href;
        } catch {
          resultEl.replaceChildren(el("p", "status fail", "Invalid URL"));
          return;
        }
        const submit = form.querySelector("button[type=submit]");
        submit.disabled = true;
        const row = makeRow(method, url);
        resultEl.replaceChildren(el("div", "checks"));
        resultEl.firstChild.append(row.wrap);
        setRow(row, "pending", "testing…");

        const r = await probe(url, { method });
        submit.disabled = false;
        if (!r.reached) return setRow(row, "fail", "unreachable", `${r.error} (${r.ms} ms)`);
        if (r.opaque) {
          return setRow(row, "warn", "reachable", `Server responded, but CORS hides the status and body (${r.ms} ms)`);
        }
        const { res, body, ms } = r;
        setRow(row, res.ok ? "ok" : "fail", `${res.status} ${res.statusText}`.trim(),
          `${res.headers.get("content-type") || "no content-type"} · ${body.length} chars · ${ms} ms`);
        if (body) {
          let shown = body;
          try { shown = JSON.stringify(JSON.parse(body), null, 2); } catch {}
          resultEl.append(el("pre", null, shown.length > 5000 ? `${shown.slice(0, 5000)}\n… (truncated)` : shown));
        }
      });
    </script>
  </body>
</html>
